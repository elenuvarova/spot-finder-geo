# Render Blueprint — ONE free service.
# A multi-stage Docker build compiles the React/Vite frontend and then runs the
# FastAPI backend, which serves both the API (/api/*, /health) and the built UI
# from the same origin. No separate frontend host needed.
services:
  - type: web
    name: spotfinder-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Secret — set the value in the Render dashboard (Environment tab).
      # Leave unset to run in template-only mode (no Gemini).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      # Lock CORS to the deployed origin. The UI and API share this host, so CORS
      # is mostly moot in prod, but this replaces the default-open "*" posture.
      - key: FRONTEND_ORIGIN
        value: https://foodspotter.ontwrpn.com
